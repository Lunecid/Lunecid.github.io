# evidence.kind: project → /projects/<id>/ (상세 페이지가 있는 프로젝트만), research → /research/<id>/,
#   code → 논문의 공개 코드(publications의 code, v1.0-cog2026 태그). 논문 페이지는 초록만 보여 주므로(D-15)
