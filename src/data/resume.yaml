# resume.yaml — /records/ 페이지와 이력서 PDF 3종(국문 이력서·영문 Resume 1쪽·Academic CV)의 단일 원본.
# 규칙
# - 한·영 필드는 { ko, en } 순서로 둔다. 날짜는 모두 따옴표로 감싼 문자열('YYYY-MM' 또는 'YYYY-MM-DD')이다.
# - pdf: { ko, en, academic } 은 각 PDF에 이 항목을 넣을지 정한다. /records/ 페이지는 pdf 값과 상관없이 모두 보여 준다.
# - records: false 인 항목은 /records/ 페이지에 보이지 않는다(생략하면 true). PDF 전용 항목에만 쓴다.
# - 전화번호·생년월일·학번·국가연구자번호·자격 번호·주소·병역·다른 팀원 이름은 이 파일에 넣지 않는다(spec §9.1).
# - 제출용 PDF(전화번호 포함)는 이 저장소 밖에서 따로 만든다.

profile:
  name:
    ko: 백성은
    en: Seongeun Baek
  # headline·tagline·status·about은 버전 문구다: src/variants/{game,data}.ts identity (R-3).
  affiliation:
    ko: 부산대학교 데이터사이언스전문대학원 데이터사이언스연구실(DataLab)
    en: Data Science Lab (DataLab), Graduate School of Data Science, Pusan National University
  advisor:
    ko: 권준호 교수
    en: Prof. Joonho Kwon
  location:
    ko: 부산
    en: Busan, South Korea
  email: todtjddms104204@pusan.ac.kr
  github: Lunecid
  site: https://lunecid.github.io
  # 연구 관심사 = 연구 페이지의 세 관심사 제목(src/data/research-page.ts interests[].title, P1-19). 기술 목록이 아니다.
  researchInterests:
    pdf: { ko: false, en: false, academic: true }
    items:
      - { ko: 로그로 읽는 플레이어 행동, en: Player behavior from logs }
      - { ko: 시간과 공간 속의 팀 플레이, en: Team play in space and time }
      - { ko: 읽을 수 있는 결과, en: Results people can read }

