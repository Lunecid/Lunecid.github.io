name: Build, test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * *' # 18:30 UTC = 03:30 KST (daily data refresh + redeploy)

# Nothing by default; each job asks only for what it needs.
permissions: {}

# One deployment at a time; never cancel a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: gitleaks needs every commit in its range (all commits on the scheduled and manual scans)
          persist-credentials: false # nothing in this job pushes: keep GITHUB_TOKEN out of .git/config

      # The pinned action scans `git log --no-merges --first-parent <first pushed commit>^..<head>` on a push. On the
      # first push of a new repository the first pushed commit is the root commit, which has no parent, so that range
      # is invalid and the scan fails. The action's documented BASE_REF override then points at a throwaway local
      # commit whose parent is an empty root unrelated to this history, so the range `<BASE_REF>^..<head>` reaches back
      # to the root commit. The push scan still passes --no-merges --first-parent, so it covers head's first-parent
      # line (all of this repository's linear history) but not merge commits or other branches; the daily schedule
      # and manual runs scan every commit. The two throwaway commits exist only in this runner.
      - name: Scan from the root commit when the push starts there
        if: github.event_name == 'push'
        env:
          FIRST_PUSHED: ${{ github.event.commits[0].id }}
          GIT_AUTHOR_NAME: gitleaks-base
          GIT_AUTHOR_EMAIL: gitleaks-base@localhost
          GIT_COMMITTER_NAME: gitleaks-base
          GIT_COMMITTER_EMAIL: gitleaks-base@localhost
        run: |
          if [ -n "$FIRST_PUSHED" ] && ! git rev-parse --verify --quiet "${FIRST_PUSHED}^" > /dev/null; then
            empty_tree=$(git mktree < /dev/null)
            orphan=$(git commit-tree "$empty_tree" -m 'gitleaks scan base (local only)')
            base=$(git commit-tree "$empty_tree" -p "$orphan" -m 'gitleaks scan base (local only)')
            echo "BASE_REF=$base" >> "$GITHUB_ENV"
            echo "The push starts at the root commit: gitleaks scans from the root commit."
          fi

      # Secrets place 3 of 4.
      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0 (node24; no license needed for a personal account)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Linked game accounts (account-link spec §7). Its own job so the Steam key never meets npm packages: no npm cache,
  # no npm ci, Node built-ins only. With no ACCOUNT_* variable set it makes no request and uploads no artifact.
  fetch-accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: account-fetch # STEAM_API_KEY is this environment's secret; deployment branches: main only (owner step 8-1)
    permissions:
      contents: read # checkout only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # no npm cache, no npm ci: the Steam key never meets third-party code
      # Secrets place 4 of 4. Values reach the script only through env (never ${{ }} inside run:).
      # The runner prints a step's env block, so vars.* values appear in plain text in the run log (spec R-14).
      # The script always exits 0: a failed platform writes an error feed (or nothing) and only hides its card.
      - name: Fetch linked game accounts
        run: node scripts/fetch-accounts.mjs --out account-feeds
        env:
          ACCOUNT_GENSHIN_UID: ${{ vars.ACCOUNT_GENSHIN_UID }}
          ACCOUNT_GENSHIN_NAME: ${{ vars.ACCOUNT_GENSHIN_NAME }}
          ACCOUNT_ZZZ_UID: ${{ vars.ACCOUNT_ZZZ_UID }}
          ACCOUNT_ZZZ_NAME: ${{ vars.ACCOUNT_ZZZ_NAME }}
          ACCOUNT_STEAM_ID64: ${{ vars.ACCOUNT_STEAM_ID64 }}
          ACCOUNT_STEAM_NAME: ${{ vars.ACCOUNT_STEAM_NAME }}
          ACCOUNT_RIOT_ID: ${{ vars.ACCOUNT_RIOT_ID }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: account-feeds
          path: account-feeds/
          retention-days: 1
          if-no-files-found: ignore

  build:
    needs: [fetch-accounts]
    if: ${{ !cancelled() }} # the build runs even when the account job failed or was refused by the environment rule
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      auth_failed: ${{ steps.fetchstatus.outputs.auth_failed }}
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing in this job pushes: later steps (npm packages included) never see GITHUB_TOKEN

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Bring in account feeds
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true # no artifact when the account job failed or had nothing to write: build without accounts
        with:
          name: account-feeds
          path: src/data/generated

      # Secrets place 1 of 4. Writes src/data/generated/*.json (gitignored). Fetchers never exit non-zero:
      # failures become status "error"/"partial"/"skipped" and hide their sections; 401/403 set authFailed.
      # The GoatCounter site code is not an env var: src/config.ts GOATCOUNTER.code is the single source.
      - name: Fetch build-time data
        run: npm run fetch
        env:
          GH_PROFILE_TOKEN: ${{ secrets.GH_PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}

      - name: Record fetch auth status
        id: fetchstatus
        run: node scripts/check-fetch-status.mjs src/data/generated --github-output

      - run: npm run check
      - run: npm test

      - name: Cache optimized images
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.astro
          key: astro-${{ hashFiles('src/assets/**', 'package-lock.json') }}

      - run: npm run build

      - name: Install Playwright Chromium and poppler (pdftotext, pdfinfo, pdffonts)
        run: |
          npm exec -- playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends poppler-utils

      - run: npm run build:pdf

      # Secrets place 2 of 4: detection-only values (phone, birth date, student id), matched literally in dist.
      - name: Ops tests
        run: npm run test:ops
        env:
          PII_DENYLIST: ${{ secrets.PII_DENYLIST }}

      - run: npm run test:links

      # The two test-only sites the e2e run serves next to dist/ (scripts/e2e-dists.mjs holds their build switches).
      - run: npm run build:e2e

      # Built once, checked by the e2e shards and Lighthouse in parallel. dist/ carries the CV PDFs; the Pages artifact
      # below is still dist/ alone.
      - name: Upload site builds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-builds
          path: |
            dist/
            dist-no-art/
            dist-e2e-accounts/
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload CV PDFs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cv-pdfs
          path: dist/cv/*.pdf
          retention-days: 14
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  # Playwright in three shards on the build job's directories (E2E_PREBUILT=1: playwright.config.ts serves them as
  # built, nothing is rebuilt). fail-fast off, so every shard reports.
  e2e:
    name: e2e ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: [build]
    if: ${{ !cancelled() && needs.build.result == 'success' }} # result-based: a failed account job does not skip the shards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      ASTRO_TELEMETRY_DISABLED: 1
      E2E_PREBUILT: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Bring in the site builds
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: site-builds
          path: .

      # poppler: print.spec.ts reads the printed PDFs with pdfinfo/pdftotext, as the build job's PDF step does
      - name: Install Playwright Chromium and poppler (pdftotext, pdfinfo)
        run: |
          npm exec -- playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends poppler-utils

      - run: npm run test:e2e -- --shard="$SHARD"
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}

      # Per-shard copies live one day; e2e-reports merges them into the named artifacts.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 1

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots-${{ matrix.shard }}
          path: test-results/screenshots/
          retention-days: 1
          if-no-files-found: ignore

  # One screenshots artifact (14 days) and, after a failed shard, one playwright-report artifact (7 days, a folder per
  # shard): the names and retention the privacy page states. Not a deploy prerequisite.
  e2e-reports:
    needs: [e2e]
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Merge screenshots
        uses: actions/upload-artifact/merge@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true # no shard wrote a screenshot (e.g. every shard stopped before its tests): nothing to merge
        with:
          name: screenshots
          pattern: screenshots-*
          retention-days: 14
          delete-merged: true

      - name: Merge Playwright reports
        if: needs.e2e.result == 'failure'
        uses: actions/upload-artifact/merge@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true # a shard that failed before Playwright wrote no report
        with:
          name: playwright-report
          pattern: playwright-report-*
          separate-directories: true
          retention-days: 7
          delete-merged: true

  # Lighthouse budgets on the build job's dist/, parallel to the e2e shards.
  lighthouse:
    needs: [build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Bring in the site builds
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: site-builds
          path: .

      - run: npm run test:lh

      # On a failed assertion the reports show which audit moved (one day, like the other per-run artifacts).
      - name: Upload Lighthouse reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 1
          if-no-files-found: ignore
          include-hidden-files: true

  deploy:
    needs: [build, secrets-scan, e2e, lighthouse]
    # Result-based condition: a job-level if without a status function gets success(), which checks every ancestor job
    # (fetch-accounts included), so a failed account job would skip the deploy. This checks only the direct needs; the
    # matrix job e2e is 'success' only when every shard passed.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.secrets-scan.result == 'success' && needs.e2e.result == 'success' && needs.lighthouse.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write # deploy to Pages
      id-token: write # OIDC token proving the deployment's origin
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Spec §7.1: a 401/403 during the build-time fetch fails the workflow after the deploy (the site itself
  # already hid the affected section).
  fetch-health:
    needs: [build, deploy]
    if: ${{ !cancelled() && needs.deploy.result == 'success' && needs.build.outputs.auth_failed == 'true' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail on build-time fetch auth errors
        run: 'echo "::error::build-time fetch got 401/403"; exit 1'
