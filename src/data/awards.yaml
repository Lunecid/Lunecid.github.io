  project: null
  certificate:
    alt:
      ko: 제5회 CDS빅데이터 경진대회 장려상 상장. 2024년 10월 28일 백성은에게 수여. 생년월일은 가렸습니다.
      en: Certificate of the Honorable Mention (Encouragement Award) at the 5th CDS Big Data Competition, presented to Seongeun Baek on October 28, 2024. Date of birth is hidden.
  redactionNote:
    ko: 생년월일을 가렸습니다.
    en: Date of birth is hidden.

