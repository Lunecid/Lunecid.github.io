# favorites.yaml — 플레이 로그의 FAVORITE GAMES 쇼케이스.
# 규칙
# - id는 데이터 키로만 쓴다. 페이지 주소·해시(#)·페이지 제목에 게임 상표를 쓰지 않는다(spec §3, NEXON 약관 8.4).
#   쇼케이스에서 고른 게임은 URL에 반영하지 않는다.
# - 캐릭터 이미지는 장식이므로 화면에서는 alt=""로 둔다. 저작권 표기는 notices(ui.ts의 notice.*)로 따로 보여 준다.
# - 캐릭터 이미지는 HoYoverse 공식 홈페이지 원본을 사용자 허락을 받은 뒤 받아 src/assets/characters/<id>.png로 직접 호스팅한다(spec §8, §13). 핫링크 금지.
# - tint는 쇼케이스 배경 색조에만 쓴다(spec §4: 캐릭터 고유색은 플레이 로그·쇼케이스에만).
# - account는 v1에서 모두 null이다. 값이 없으면 계정 카드는 잠금 상태로 보인다.
#   연동을 켜면 빌드 때 생성되는 src/data/generated/accounts/<integration.platform>.json을 읽는다(커밋하지 않음, spec §6·§7.1).
# - locked: true 인 게임은 목록에 비활성 버튼으로만 보이고 선택할 수 없다.
#   TFT는 LoL과 같은 Riot ID로 연동한다(account-link 설계 A-1·A-13). 이터널 리턴·하스스톤은 연동 계획이 없어 '소개 준비 중'이며,
#   주인이 소개(why·meta)를 주면 locked를 푼다(2026-09-30 주인 요청으로 추가). TFT·하스스톤은 같은 날 주인이 준 장르와
#   이유로 풀었다(최애 캐릭터 없음, 플레이 시작 연도는 받지 않아 넣지 않음). LoL은 주인이 준 시작 연도(2012)와 공개 장르(MOBA)로 풀었다(소개 문장은 받지 않음). 이터널 리턴도 같은 날 주인의 이유와, dak.gg 첫 랭크 기록(정규 시즌 6, 2024-12-12 시작 '2024 Season 6: Legion')에
#   맞춘 시작 연도 2024로 풀었다.
#   주인의 Riot ID: 루네시드#Lune (KR) — 계정 연동(op.gg·lolchess.gg 링크)에서 쓴다.
# - notices 값 → ui.ts 키: cognosphere → notice.cognosphere · zzz-fan-guide → notice.zzzCopyright + notice.zzzLegalStatement · fan-content → footer.fanContent

games:
  - id: zzz
    locked: false
    title:
      ko: 젠레스 존 제로
      en: Zenless Zone Zero
    studio: HoYoverse
    characters:
      - id: remielle
        name:
          ko: 레미엘
          en: Remielle
        position: 58% 12%
        tint: '#FF4F8B'
    why:
      ko: 도시 판타지 세계관과 빠른 액션 전투를 좋아합니다. 요즘 가장 오래 켜 두는 게임이고, 가장 좋아하는 에이전트는 레미엘입니다.
      en: I like its urban fantasy setting and fast action combat. It is the game I spend the most time in these days, and my favorite agent is Remielle.
    meta:
      - label: { ko: 플레이, en: Playing since }
        value: { ko: 2024 –, en: '2024' }
      - label: { ko: 장르, en: Genre }
        value: { ko: 액션 · 수집형, en: Action · Character collection }
      - label: { ko: 최애, en: Favorite }
        value: { ko: 레미엘, en: Remielle }
    notices: [cognosphere, zzz-fan-guide, fan-content]
    integration:
      platform: enka-zzz
      enabled: false
    account: null

