    pdf: { ko: false, en: false, academic: true }

# 이력서 PDF의 첫 프로젝트: CoG 논문(P1-20). projects 컬렉션이 아니라 publications를 가리키므로 별도 필드로 둔다
# (이 프로젝트 목록은 /records/ 프로젝트 요약도 함께 읽으므로 그 구조는 그대로 둔다 — src/lib/records.ts).
# Academic CV는 이미 publications/researchInProgress로 초록·발표를 자세히 보여 주므로 여기서는 뺀다(academic: false).
# team·period는 논문 자체 필드가 아니라 이력서 표시용이며, 사실은 논문(공저 2인)과 지도교수 협업 구조(D-15 이전 삭제된
# 사례 연구 본문의 details.기간, git show ae864ff^:src/content/research/ko/cog-2026-engagement.md)에서 가져왔다.
publicationProject:
  pub: cog-2026-engagement
  pdf: { ko: true, en: true, academic: false }
  team:
    ko: 제1저자 · 지도교수 공동연구
    en: First author · co-authored with advisor
  period: { start: '2026-02', end: '2026-09' }
  resume:
    ko:
      - Riot API 공개 경기 기록에서 한국 서버 마스터 이상 20만 6,442경기를 수집해, 연속된 세 패치에 걸친 약 100만 개의 교전 데이터를 구성함.
      - 패치 단위 시간순 홀드아웃 평가에서 LightGBM이 AUC 0.675로 신경망 기준선(AUC 0.569–0.581)을 앞섬.
      - 제1저자로 IEEE CoG 2026(스페인 마드리드)에서 구두 발표함.
    en:
      - Built a pipeline from 206,442 Korean Master+ matches (Riot API) into ~1M labeled engagements across three patches.
      - "Chronological patch-holdout evaluation: LightGBM AUC 0.675 vs. neural baselines 0.569–0.581."
      - First author; gave an oral presentation at IEEE CoG 2026 in Madrid, Spain.

# 프로젝트 세부(기간·팀·역할·요약)는 projects 컬렉션에서 가져온다. 여기서는 PDF 포함 여부와 이력서 불릿만 정한다. 순서는 버전의 순서 목록(src/variants/*.ts orders)이 정한다(A-17).
# resume: PDF 전용 이력서체 불릿(batch 3b). 웹 문구(summary/role)는 배치 3a부터 합니다체라서, PDF는 이 필드로
# 명사형/"~함" 종결의 이력서체를 따로 쓴다(없으면 summary·role로 대체). 사실은 web 카피·프로젝트 상세와 같다.
projects:
  - ref: school-zone-blindspots
    pdf: { ko: true, en: true, academic: true }
    resume:
      ko:
        - 부산 도로망 전체의 어린이 보행자 사고 위험을 예측해, 위험도는 높지만 보호구역으로 지정되지 않은 곳을 찾음.
        - 문제 정의와 분석 방향을 주도하고 QGIS 공간 매핑, XGBoost와 공간 교차검증을 설계함. 재현율 0.87, 최우수상(부산광역시장상) 수상.
      en:
        - Predicted child-pedestrian accident risk across the Busan road network and located high-risk roads outside designated school zones.
        - Led the problem framing, built the QGIS spatial pipeline, and designed the XGBoost model with spatial cross-validation. Recall 0.87; awarded the Top Excellence Award (Mayor of Busan Award).
  - ref: kickick-park
    pdf: { ko: true, en: true, academic: false }
    # fix round 1 (controller): the first bullet used to credit the owner's web service with judging parking from
    # the photo. The page says the public repo's web service adds a fixed score per uploaded photo, and the
    # judgment model (YOLOv5/v8, Mask R-CNN) was trained separately in Colab by the team (teamTools, D-9) — so the
    # first bullet now states the team's project as the page states it; the owner's own part stays in bullet two.
    resume:
      ko:
        - 5인 팀이 반납 사진 기반 주차 판정 모델과 사진 업로드·누적 점수 랭킹 웹 서비스를 기획함.
        - 입지 분석의 자치구별 데이터를 Tableau로 시각화하고 Django로 웹사이트를 구축함. 최우수상 수상.
      en:
        - A 5-person team built a return-photo parking-judgment model and a photo-upload ranking web service.
        - Visualized Seoul district (gu) data for the location analysis in Tableau and built the Django website. Awarded the Top Excellence Award.
  - ref: youth-startup-location
    pdf: { ko: true, en: true, academic: true }
    resume:
      ko:
        - 4인 팀이 부산 행정동 상권을 네 유형으로 나누고 음식점 매출을 예측해, 조건보다 매출 여유가 남은 동네를 찾음.
        - 생활인구·소비매출·음식점 데이터의 탐색과 데이터 엔지니어링을 맡음.
      en:
        - A four-person team segmented Busan districts into four commercial types and predicted restaurant sales.
        - Explored the floating-population, consumer-spending and restaurant data and did the data engineering.
  # kbo-attendance, seoul-apartment-automl: status 'card' (D-4), too thin for their own bullets. Excluded from every
  # PDF here (pdf all false) and merged into projectsNote below instead (batch 3b P1-20). /records/'s project
  # summary lists them through recordsProjectsOrder (src/variants/*.ts, P1-7b), regardless of these pdf flags.
  - ref: kbo-attendance
    pdf: { ko: false, en: false, academic: false }
  - ref: seoul-apartment-automl
    pdf: { ko: false, en: false, academic: false }

# Korean résumé only: one merged line for kbo-attendance + seoul-apartment-automl (batch 3b P1-20, "make room" for
# the 2-page limit). Crawling is named once, matching kbo-attendance's own role field so it is not repeated (P2-32).
# fix round 1 (controller): kbo-attendance tested whether team performance and attendance are related (a
# statistical test) — it did not predict attendance. Wording now follows the card's own summary/role instead of
# "예측". The seoul-apartment-automl half was checked the same way: its card genuinely is a sale-price prediction
# (summary: "매매가 예측 모델을 고르고"), so "예측" stays correct there.
projectsNote:
  ko: 이 밖에 KBO 구단 성적과 관중 수의 관계를 검정한 수업 프로젝트(크롤링·전처리 담당)와 AutoML 기반 서울 아파트 매매가 예측 부트캠프 프로젝트(모델링·Tableau 시각화 담당)를 수행함.
