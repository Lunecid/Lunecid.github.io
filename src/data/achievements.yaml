# achievements.yaml — 사이트 업적 7개(spec §5: 6–10개, 콘텐츠와 연결된 것만).
# 규칙
# - 반복 작업형 업적·경험치(XP)·점수·리더보드는 만들지 않는다. 업적 때문에 콘텐츠를 잠그지 않는다.
# - 달성 상태는 방문자 브라우저의 localStorage에만 저장한다(오류가 나면 무시). 서버로 보내지 않는다.
# - hidden: true 는 달성 전까지 제목·설명을 '???'로 가리고 hint만 보여 준다.
# - trigger 값과 발생 위치
#     open-abstract       논문 [초록]을 펼침(홈 연구 하이라이트, 연구 페이지, 기록 페이지 논문 목록 어디서든)
#     finish-cog-story    CoG 논문 페이지의 끝(링크·BibTeX 블록 아래)이 화면에 들어옴(D-15; 저장된 달성 기록을 지키려고 id·trigger는 그대로)
#     open-certificate    '상장 보기' 모달을 엶
#     visit-all-sections  연구·프로젝트·기록·플레이 로그 네 페이지를 모두 방문(언어 무관)
#     switch-language     한국어·영어 페이지를 모두 방문
#     bgm-on              배경음악 버튼을 켬
#     konami              ↑ ↑ ↓ ↓ ← → ← → B A 입력(입력 칸에 포커스가 있을 때는 무시)
#   view-player-log 트리거는 visit-all-sections에 포함되므로 쓰지 않는다.

- id: abstract-reader
  trigger: open-abstract
  hidden: false
  title:
    ko: 초록 펼치기
    en: Abstract Opened
  description:
    ko: 논문 초록을 펼쳐 읽었습니다.
    en: Opened a paper abstract.
  hint:
    ko: 논문의 [초록]을 눌러 보세요.
    en: Try [Abstract] on a paper.

- id: cog-story-complete
  trigger: finish-cog-story
  hidden: false
  title:
    ko: 논문 끝까지 읽기
    en: Read to the End
  description:
    ko: CoG 2026 논문 페이지를 초록부터 BibTeX까지 읽었습니다.
    en: Read the CoG 2026 paper page from the abstract to the BibTeX.
  hint:
    ko: CoG 논문 페이지를 끝까지 내려 보세요.
    en: Read the paper page to the end.

- id: certificate-checked
  trigger: open-certificate
  hidden: false
  title:
    ko: 상장 확인
    en: Certificate Checked
  description:
    ko: 수상 기록의 상장 이미지를 열어 확인했습니다.
    en: Opened an award certificate.
  hint:
    ko: 기록 페이지의 [상장 보기]를 눌러 보세요.
    en: Try [View certificate] on the Records page.

- id: map-explored
  trigger: visit-all-sections
  hidden: false
  title:
    ko: 전 구역 탐색
    en: Map Explored
  description:
    ko: 연구, 프로젝트, 기록, 플레이 로그를 모두 둘러봤습니다.
    en: Visited Research, Projects, Records, and Player Log.
  hint:
    ko: 메뉴 01부터 04까지 모두 들어가 보세요.
    en: Open every menu item from 01 to 04.

- id: bilingual
  trigger: switch-language
  hidden: false
  title:
    ko: 두 언어로
    en: Both Languages
  description:
    ko: 한국어와 영어 페이지를 모두 열었습니다.
    en: Viewed the site in both Korean and English.
  # 언어 전환은 734px 이상에서는 상단 막대(한국어 페이지 'KO / EN', 영어 페이지 'EN / KO'), 휴대폰에서는 메뉴 패널 안에 있다(HudNav).
  hint:
    ko: 상단의 KO / EN을 눌러 보세요. 휴대폰에서는 메뉴 → English입니다.
    en: Try EN / KO at the top. On a phone, it is Menu → 한국어.

- id: sound-on
  trigger: bgm-on
  hidden: false
  title:
    ko: 소리 켜짐
    en: Sound On
  description:
    ko: 배경음악을 켰습니다. 곡은 HoliznaCC0의 “Everything You Ever Dreamed.”입니다.
    en: Turned on the background music, “Everything You Ever Dreamed.” by HoliznaCC0.
  hint:
    ko: 상단의 [♪ BGM] 버튼을 눌러 보세요.
    en: Try [♪ BGM] at the top.

- id: konami
  trigger: konami
  hidden: true
  title:
    ko: ↑↑↓↓←→←→BA
    en: ↑↑↓↓←→←→BA
  description:
    ko: 코나미 커맨드를 입력했습니다.
    en: Entered the Konami Code.
  hint:
    ko: 고전 게임의 비밀 커맨드를 키보드로 입력해 보세요.
    en: Type a classic cheat code on the keyboard.
