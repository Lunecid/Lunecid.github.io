# jobfit.game.yaml — 게임 버전 기록 페이지 '지원 요건 대응' 섹션(/game/records/#job-fit). 원본: spec §9.2.
# 규칙
# - 게임 계정 연동 데이터는 이 표에 넣지 않는다(NEXON Open API 약관 8.2).
# - status: met(충족) | partial(부분) | in-progress(보완 중) | later(후순위) | n-a(해당 없음)
# - 한 행에 요건이 둘이면 requirement와 frequency를 ' · '로 나누고 같은 순서로 쓴다.
# - evidence.short: 표(734px 이상)에 보이는 짧은 라벨. label의 일부분이어야 한다(스크린 리더와 title은 label 전체).
#   괄호 속 도구명 같은 세부는 label에만 둔다(P1-11). 짧게 줄일 필요가 없으면 쓰지 않는다.
# - evidence.href: 사이트 안 경로는 한국어 기준으로 적고, 렌더러가 영어 페이지에서 /en 접두사를 붙인다. 외부 주소는 그대로 쓴다.
#   근거는 링크한 페이지가 지금 보여 주는 내용(제목·초록·본문·링크)으로 확인할 수 있어야 한다. 팀원이 한 일은 본인 근거로 쓰지 않는다(D-9).
# - plan(보완 계획): 실제 역량을 키우는 다음 단계만 쓴다. 날짜와 사이트 제작 할 일은 쓰지 않는다.
#   충족 행과 실제 다음 단계가 없는 행은 null로 두고, 표에서는 빈칸으로 보인다(D-6).
# - sources: 참고한 공고는 회사명·주소 없이 건수와 기간만 적는다(D-6).
# - sample: 조사한 공고 수와 기간. intro·sources의 {table.count}·{table.years}가 이 값이다(R-4). 빈도의 분모는 sample.count와 같아야 한다.
# - 요건이 바뀌면 asOf를 고친다.

asOf: '2026-09-26'

sample: { count: 13, years: '2024–2026' }

intro:
  ko: >-
    국내 게임사 데이터 분석가 공고 {table.count}건({table.years}, 원문 확인)에서 자주 나온 요건과,
    요건마다 제 근거와 보완 계획을 정리했습니다. 빈도는 그 요건을 언급한 공고 수입니다.
  en: >-
    These are the requirements that came up most often in {table.count} data analyst job postings from Korean game companies
    ({table.years}, checked against the original postings), with my evidence and next step for each.
    Frequency is the number of postings that mention the requirement.

rows:
  - id: python-ml
    requirement: { ko: Python · 머신러닝, en: Python · Machine learning }
    frequency: '12/13 · 7/13'
    evidence:
      - label: { ko: CoG 2026 논문(LightGBM), en: CoG 2026 paper (LightGBM) }
        short: { ko: 'CoG 2026 논문', en: 'CoG 2026 paper' }
        href: /research/cog-2026-engagement/
      # PyTorch is not on the paper page (abstract only, D-15); the tagged code uses it (requirements.txt, import torch).
      - label: { ko: CoG 2026 코드(PyTorch), en: CoG 2026 code (PyTorch) }
        short: { ko: 'CoG 2026 코드', en: 'CoG 2026 code' }
        href: https://github.com/Lunecid/LOL_teamfight_Lab/tree/v1.0-cog2026
      # The youth start-up case backs no row: my part there was data exploration and data engineering (owner,
      # 2026-09-28); its models, K-Means and Streamlit dashboard are the team's work (D-9).

      - label: { ko: 어린이 보호구역 사각지대(XGBoost), en: School-zone blind spots (XGBoost) }
        short: { ko: '보호구역 사각지대', en: 'School-zone blind spots' }
        href: /projects/school-zone-blindspots/
    status: met
    plan: null

  - id: game-literacy
    requirement: { ko: 게임 이해도, en: Game literacy }
    frequency: '12/13'
    evidence:
      - label: { ko: 리그 오브 레전드 교전 예측 논문, en: League of Legends engagement paper }
        short: { ko: '리그 오브 레전드', en: 'League of Legends' }
        href: /research/cog-2026-engagement/
      - label: { ko: PUBG 시공간 그래프 연구(진행 중), en: PUBG spatiotemporal graph study (in progress) }
        short: { ko: 'PUBG 시공간 그래프 연구', en: 'PUBG spatiotemporal graph' }
        href: /research/#in-progress
    status: met
    plan: null

  - id: degree
    requirement: { ko: 학위, en: Degree }
    frequency: '6/13'
    evidence:
      - label: { ko: 석사과정 재학(2027년 2월 졸업 예정), en: M.S. student (expected February 2027) }
        short: { ko: '석사과정 재학', en: 'M.S. student' }
        href: /records/#education
      - label: { ko: IEEE CoG 2026 구두 발표, en: IEEE CoG 2026 oral presentation }
        short: { ko: 'IEEE CoG 2026 구두 발표', en: 'IEEE CoG 2026 oral' }
        href: /research/cog-2026-engagement/
    status: met
    plan: null

  - id: statistics
    requirement: { ko: 통계 · 가설검증, en: Statistics · Hypothesis testing }
    frequency: '11/13 · 4/13'
    evidence:
      - label: { ko: 공간 블록 교차검증(사각지대), en: Spatial block cross-validation (school-zone blind spots) }
        short: { ko: '공간 블록 교차검증', en: 'Spatial block cross-validation' }
        href: /projects/school-zone-blindspots/
    status: partial
    plan: { ko: 패치 전후 영향 비교 리포트 샘플, en: A before/after patch-impact report sample }

  - id: communication
    requirement: { ko: 소통·스토리텔링, en: Communication and storytelling }
    frequency: '11/13'
    evidence:
      - label: { ko: IEEE CoG 2026 구두 발표, en: IEEE CoG 2026 oral presentation }
        short: { ko: 'IEEE CoG 2026 구두 발표', en: 'IEEE CoG 2026 oral' }
        href: /research/cog-2026-engagement/
      - label: { ko: 사각지대 사례 연구의 기획자·PM 관점, en: Planner/PM perspective in the school-zone case study }
        short: { ko: '기획자·PM 관점', en: 'Planner/PM perspective' }
        href: /projects/school-zone-blindspots/
    status: partial
    plan: null

  - id: scale-cloud
    requirement: { ko: 대용량 데이터·클라우드, en: Large-scale data and cloud }
    frequency: '9/13'
    evidence:
      - label: { ko: CoG 논문 데이터 20.6만 경기 처리, en: Processing 206K matches for the CoG paper }
        short: { ko: '20.6만 경기 처리', en: 'Processing 206K matches' }
        href: /research/cog-2026-engagement/
    status: partial
    plan: { ko: 장기 과제(Airflow·Spark·BigQuery), en: 'Long-term: Airflow, Spark, BigQuery' }

  - id: game-metrics-logs
    requirement: { ko: 게임 지표 · 로그 설계·검증, en: Game metrics · Log design and validation }
    frequency: '8/13 · 4/13'
    evidence:
      # Final review fix 1 item 12: the abstract's own terms (the paper page is abstract-only since D-15 and names no API endpoint).
      - label: { ko: Riot API 사건 기록 · 패치 단위 시간순 홀드아웃, en: Riot API event logs · chronological patch holdout }
        short: { ko: 'Riot API 사건 기록', en: 'Riot API event logs' }
        href: /research/cog-2026-engagement/
    status: partial
    plan: { ko: 리텐션·코호트 미니 분석, en: A small retention/cohort analysis }

  - id: bi-tableau
    requirement: { ko: BI · Tableau, en: BI · Tableau }
    frequency: '7/13 · 5/13'
    evidence:
      - label: { ko: 킥킥파크 Tableau 자치구별 시각화, en: KickKick Park Tableau visualization of Seoul districts (gu) }
        short: { ko: '킥킥파크 Tableau', en: 'KickKick Park Tableau' }
        href: /projects/kickick-park/
    status: partial
    plan: { ko: Tableau Public 게임 KPI 대시보드, en: A game KPI dashboard on Tableau Public }

  - id: sql
    requirement: { ko: SQL, en: SQL }
    frequency: '11/13'
    evidence:
      - label: { ko: 부트캠프 MySQL(킥킥파크 웹 서비스), en: MySQL in bootcamp (KickKick Park web service) }
        short: { ko: '부트캠프 MySQL', en: 'MySQL in bootcamp' }
        href: /projects/kickick-park/
    status: in-progress
    plan: { ko: SQL 자격증 취득 예정, en: Planning to earn an SQL certification }

  - id: take-home
    requirement: { ko: 과제 전형, en: Take-home assignment }
    frequency: '5/13'
    evidence: []
    status: in-progress
    plan:
      ko: 패치 전후 영향 비교 리포트 샘플(문제 → 분석 → 해석 → 1쪽 리포트)
      en: 'A before/after patch-impact report sample (problem → analysis → interpretation → one-page report)'

  - id: ai-llm
    requirement: { ko: AI·LLM 활용, en: Using AI and LLMs }
    frequency: '4/13'
    evidence: []
    status: in-progress
    plan: { ko: LLM으로 검증·리포트를 자동화한 사례, en: An example of automating validation and reporting with an LLM }

  - id: bm-anomaly
    requirement: { ko: BM·게임 경제 · 이상탐지, en: Monetization and game economy · Anomaly detection }
    frequency: '5/13 · 3/13'
    evidence: []
    status: later
    plan: null

  - id: certs-languages
    requirement: { ko: 자격증·어학, en: Certifications and languages }
    frequency: '0/13'
    evidence:
      - label: { ko: ADsP · TOEIC, en: ADsP · TOEIC }
        href: /records/#certifications
    status: n-a
    plan: null

sources:
